name: iStoreOS Builder

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target
        required: false
        type: string
        default: cudy_tr3000-v1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential g++ gawk gettext git libncurses-dev libssl-dev make python3 rsync subversion swig unzip wget xsltproc zlib1g-dev

      - name: clone
        run: git clone --depth 1 --single-branch -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

      - name: copy_files
        run: |
          if [ -d files ]; then
            cp -af files/* openwrt/files/ 2>/dev/null || true
          fi

      - name: fix_mirrors
        run: |
          cd openwrt
          cat > /tmp/fix.py << PYEND
import json
with open('scripts/projectsmirrors.json') as f:
    data = json.load(f)
for key in list(data.keys()):
    data[key] = [u for u in data[key] if '.cn' not in u]
data['@KERNEL'] = ['https://cdn.kernel.org/pub']
with open('scripts/projectsmirrors.json', 'w') as f:
    json.dump(data, f, indent=2)
PYEND
          python3 /tmp/fix.py

      - name: feeds
        run: |
          cd openwrt
          echo 'src-git store https://github.com/linkease/istore.git;main' >> feeds.conf.default
          echo 'src-git third https://github.com/jjm2473/openwrt-third.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: config
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
          cp $GITHUB_WORKSPACE/config/512m.config .config
          make defconfig

      - name: download
        run: cd openwrt && make download -j4 V=s
        continue-on-error: true
        timeout-minutes: 120

      - name: build
        run: cd openwrt && make -j4 V=s
        timeout-minutes: 240

      - name: artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: openwrt/bin/targets/mediatek/filogic/

      - name: release
        uses: ncipollo/release-action@v1
        if: success()
        with:
          tag: build-1
          name: iStoreOS for Cudy TR3000
          artifacts: openwrt/bin/targets/mediatek/filogic/*.bin
          token: ${{ secrets.GITHUB_TOKEN }}
