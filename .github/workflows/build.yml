name: Build iStoreOS

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential g++ gawk gettext git libncurses-dev libssl-dev make python3 rsync subversion swig unzip wget xsltproc zlib1g-dev
      
      - name: Clone source
        run: git clone --depth 1 --single-branch -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt
      
      - name: Copy files
        run: |
          if [ -d files ]; then
            cp -af files/* openwrt/files/ 2>/dev/null || true
          fi
      
      - name: Update feeds
        run: |
          cd openwrt
          echo 'src-git store https://github.com/linkease/istore.git;main' >> feeds.conf.default
          echo 'src-git third https://github.com/jjm2473/openwrt-third.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
          cp /github/workspace/config/512m.config .config
          make defconfig
      
      - name: Download
        run: cd openwrt && make -j$(nproc) download V=s
        timeout-minutes: 60
      
      - name: Build
        run: cd openwrt && make -j$(nproc) V=s
        timeout-minutes: 240
      
      - name: Check output
        id: check
        run: |
          ls -la openwrt/bin/targets/mediatek/filogic/ 2>/dev/null || echo "No output dir"
          echo "files=$(ls openwrt/bin/targets/mediatek/filogic/*.bin 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iStoreOS-CudyTR3000
          path: openwrt/bin/targets/mediatek/filogic/
      
      - uses: ncipollo/release-action@v1
        if: steps.check.outputs.files > 0
        with:
          tag: build-$(date +%Y%m%d-%H%M)
          name: iStoreOS Cudy TR3000 $(date +%Y%m%d)
          artifacts: "openwrt/bin/targets/mediatek/filogic/*.bin,openwrt/bin/targets/mediatek/filogic/*.itb"
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - if: success() && steps.check.outputs.files > 0
        run: |
          TAG="build-$(date +%Y%m%d-%H%M)"
          curl -X POST "https://push.xrdp.fun:3443/api/push/e0eea2dc719f4ba8ba6fd443fc276463" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"iStoreOS 编译成功\",\"content\":\"Cudy TR3000 固件已发布\\nhttps://github.com/cainaorun/istoreos-cudy-tr3000/releases/tag/$TAG\",\"type\":\"text\"}"
      
      - if: failure()
        run: |
          curl -X POST "https://push.xrdp.fun:3443/api/push/e0eea2dc719f4ba8ba6fd443fc276463" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"iStoreOS 编译失败\",\"content\":\"Cudy TR3000 编译失败\\nhttps://github.com/cainaorun/istoreos-cudy-tr3000/actions/runs/${{ github.run_id }}\",\"type\":\"text\"}"
