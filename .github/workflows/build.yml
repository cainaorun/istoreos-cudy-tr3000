name: iStoreOS Builder

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Init
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential g++ gawk gettext git libncurses-dev libssl-dev make python3 rsync subversion swig unzip wget xsltproc zlib1g-dev
      - name: Clone
        run: git clone --depth 1 --single-branch -b $REPO_BRANCH $REPO_URL openwrt
      - name: Feeds
        run: |
          cd openwrt
          echo 'src-git store https://github.com/linkease/istore.git;main' >> feeds.conf.default
          echo 'src-git third https://github.com/jjm2473/openwrt-third.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Config
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
          cp /github/workspace/config/512m.config .config
          make defconfig
      - name: Download
        run: cd openwrt && make -j$(nproc) download
      - name: Build
        run: cd openwrt && make -j$(nproc) || make -j1 V=s
      - name: Create Release
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          echo "iStoreOS for Cudy TR3000" > release.txt
          echo "Build date: $(date '+%Y-%m-%d %H:%M')" >> release.txt
      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-$(date +%Y%m%d-%H%M)
          name: iStoreOS Cudy TR3000 $(date +%Y%m%d)
          body: |
            iStoreOS for Cudy TR3000 自动编译
            基于 padavanonly/immortalwrt-mt798x-6.6
          artifacts: openwrt/bin/targets/mediatek/filogic/*
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: true
