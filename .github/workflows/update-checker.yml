name: Check Upstream Updates

on:
  schedule:
    - cron: '0 6 * * *'  # 每天6点UTC=14点CST
  workflow_dispatch:

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-22.04
    outputs:
      need_build: ${{ steps.check.outputs.need_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream commits
        id: check
        run: |
          LAST_HASH_FILE=.last_upstream_hash
          UPSTREAM_REPO=https://github.com/padavanonly/immortalwrt-mt798x-6.6
          UPSTREAM_BRANCH=openwrt-24.10-6.6

          LATEST_HASH=$(git ls-remote $UPSTREAM_REPO $UPSTREAM_BRANCH | awk '{print $1}')
          echo "Latest upstream: $LATEST_HASH"

          if [ -f "$LAST_HASH_FILE" ]; then
            LAST_HASH=$(cat $LAST_HASH_FILE)
            echo "Last build hash: $LAST_HASH"
            if [ "$LATEST_HASH" = "$LAST_HASH" ]; then
              echo "No upstream changes, skipping build"
              echo "need_build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "New upstream commits found!"
          echo "$LATEST_HASH" > $LAST_HASH_FILE
          git config user.email 'bot@github.com'
          git config user.name 'Auto Bot'
          git add $LAST_HASH_FILE
          git commit -m "Update upstream hash to $LATEST_HASH"
          git push
          echo "need_build=true" >> $GITHUB_OUTPUT

  build:
    name: Build iStoreOS
    needs: check
    if: needs.check.outputs.need_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Init
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential g++ gawk gettext git libncurses-dev libssl-dev make python3 rsync subversion swig unzip wget xsltproc zlib1g-dev
      - name: Clone source
        run: git clone --depth 1 --single-branch -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt
      - name: Feeds
        run: |
          cd openwrt
          echo 'src-git store https://github.com/linkease/istore.git;main' >> feeds.conf.default
          echo 'src-git third https://github.com/jjm2473/openwrt-third.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Config
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
          cp /github/workspace/config/512m.config .config
          make defconfig
      - name: Download
        run: cd openwrt && make -j$(nproc) download
      - name: Build
        run: cd openwrt && make -j$(nproc) || make -j1 V=s
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: auto-$(date +%Y%m%d-%H%M)
          name: iStoreOS Cudy TR3000 $(date +%Y%m%d)
          body: |
            iStoreOS for Cudy TR3000 自动编译
            基于 padavanonly/immortalwrt-mt798x-6.6
          artifacts: openwrt/bin/targets/mediatek/filogic/*
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: true
